name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history/tags so the release preflight can verify that HEAD is
          # exactly the pushed ANNOTATED tag object (git cat-file -t == "tag").
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Reproducible installs only: npm ci fails on any package.json/lockfile
      # drift and supplies the exact tracked @yao-pkg/pkg devDependency.
      - name: npm ci
        run: npm ci

      - name: Build hook DLL
        run: npm run build:hook

      - name: Setup Python venv (pinned requirements)
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r python\requirements.txt

      # Reproducible Inno Setup toolchain: the official 6.7.3 installer is
      # downloaded from the authoritative GitHub release asset
      # (jrsoftware/issrc tag is-6_7_3) over HTTPS and SHA256-verified BEFORE
      # execution, then installed per-user (/CURRENTUSER) into
      # LocalApplicationData so the OS-derived discovery path in
      # scripts/build-dist.ps1 finds it. scripts/build-dist.ps1 additionally
      # pins the exact ISCC.exe SHA256, Authenticode signer, and file version
      # at build time. No unpinned Chocolatey package is used; setup steps use
      # first-party actions only (the pre-existing third-party
      # softprops/action-gh-release upload step is unchanged).
      - name: Install pinned Inno Setup 6.7.3
        run: |
          $ErrorActionPreference = "Stop"
          $expectedSha256 = "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"
          $installerUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash
          if ($actualSha256 -cne $expectedSha256) {
            throw "downloaded Inno Setup installer sha256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          $setupProcess = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Inno Setup 6.7.3 installer exited with $($setupProcess.ExitCode)"
          }
          $localAppData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          $isccPath = Join-Path $localAppData "Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "pinned Inno Setup compiler missing after install: $isccPath"
          }
          Write-Host "Inno Setup 6.7.3 installed: $isccPath"

      - name: Run tests
        run: npm test

      - name: Required real pkg provenance smoke
        env:
          RB_OUTPUT_PKG_SMOKE: "1"
        run: node --test tests/pkg-packaging.test.js

      - name: Build dist
        run: npm run build:dist

      - name: Upload installer, ZIP, and release manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DJLinkForPCDJ-setup.exe
            dist/rb-output-*.zip
            dist/release-manifest.json
          fail_on_unmatched_files: true
