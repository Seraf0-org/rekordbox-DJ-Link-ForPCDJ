name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history/tags so the release preflight can verify that HEAD is
          # exactly the pushed ANNOTATED tag object (git cat-file -t == "tag").
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Reproducible installs only: npm ci fails on any package.json/lockfile
      # drift and supplies the exact tracked @yao-pkg/pkg devDependency.
      - name: npm ci
        run: npm ci

      - name: Build hook DLL
        run: npm run build:hook

      - name: Setup Python venv (pinned requirements)
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r python\requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run tests
        run: npm test

      - name: Required real pkg provenance smoke
        env:
          RB_OUTPUT_PKG_SMOKE: "1"
        run: node --test tests/pkg-packaging.test.js

      - name: Build dist
        run: npm run build:dist

      - name: Upload installer, ZIP, and release manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DJLinkForPCDJ-setup.exe
            dist/rb-output-*.zip
            dist/release-manifest.json
          fail_on_unmatched_files: true
